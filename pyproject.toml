[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-generator"
version = "1.0.0"
description = "Local, AI-driven lead generation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alok" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "dnspython>=2.6,<3",
    "idna>=3.7,<4",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=4,<7",
    "python-docx>=1.1,<2",
    "mcp>=2,<3",
    "fastapi>=0.149,<1",
    "uvicorn>=0.30,<1",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "ruff>=0.5",
    "respx>=0.21",
]

[project.scripts]
leadgen = "leadgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leadgen = ["guides/*.md", "schema.sql", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
